name: Build Android APK (EAS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Installer les dépendances npm
        run: npm install

      - name: Installer et authentifier EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Vérifier l'authentification Expo
        run: eas whoami

      - name: Compiler l'APK sur les serveurs EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json

      - name: Afficher le résultat brut
        run: cat build-result.json

      - name: Télécharger l'APK compilé
        run: |
          node -e "
            const fs = require('fs');

            const raw = fs.readFileSync('build-result.json', 'utf8');
            const parsed = JSON.parse(raw);
            const build = Array.isArray(parsed) ? parsed[0] : parsed;
            const url = build.artifacts && build.artifacts.buildUrl;

            if (!url) {
              console.error('Pas d\\'URL d\\'APK trouvée dans le résultat EAS.');
              process.exit(1);
            }

            fs.writeFileSync('apk-url.txt', url);
          "

          curl -L "$(cat apk-url.txt)" -o compagnon-voyage.apk

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: compagnon-voyage-rn-apk
          path: compagnon-voyage.apk
          retention-days: 30
